name: Release
on:
  schedule:
    # automatic release (if there are pending changesets) twice a month
    - cron: "0 6 1,15 * *"
  # manual release: Actions -> Release -> Run workflow
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run - only show what would be released, don't push, publish or create a GitHub release"
        type: boolean
        default: false

concurrency: release

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write # push release commit/tag, create GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      # inputs are empty for scheduled runs - those are always real releases
      DRY_RUN: ${{ inputs.dry-run == true }}
    steps:
      - name: Check branch
        if: ${{ github.ref != 'refs/heads/main' && env.DRY_RUN != 'true' }}
        run: |
          echo "::error::Releases can be published only from main (got $GITHUB_REF). Use dry run to preview other branches."
          exit 1
      - uses: actions/checkout@v7
        with:
          # tags are needed to find the previous release
          fetch-depth: "0"
      - name: Setup git user
        # official GitHub Actions bot account (41898282 is its user id),
        # so release commits are attributed to github-actions[bot]
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Check for an unfinished release
        # package.json on main always holds the last tagged version. If that release failed after pushing
        # its tag (e.g. on npm publish), finish it from the tag first - pending changesets go out in the next run.
        run: |
          name=$(node -p "require('./package.json').name")
          current=$(node -p "require('./package.json').version")
          if ! git rev-parse -q --verify "refs/tags/v$current" > /dev/null; then
            exit 0
          fi
          npm=false
          gh_release=false
          [ -z "$(npm view "$name@$current" version 2>/dev/null)" ] && npm=true
          gh release view "v$current" > /dev/null 2>&1 || gh_release=true
          if [ "$npm" = false ] && [ "$gh_release" = false ]; then
            exit 0
          fi
          echo "v$current is tagged but not fully released - finishing it (npm: $npm, GitHub release: $gh_release)" | tee -a "$GITHUB_STEP_SUMMARY"
          git checkout "v$current"
          {
            echo "RELEASE_VERSION=$current"
            echo "RELEASE_NEW=false"
            echo "RELEASE_NPM=$npm"
            echo "RELEASE_GH=$gh_release"
          } >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install rimraf
        run: npm i -g rimraf
      - name: Install dependencies
        run: pnpm i
      - name: Add changeset for dependencies updates
        if: ${{ !env.RELEASE_VERSION }}
        run: pnpm changeset.deps
      - name: Version package
        if: ${{ !env.RELEASE_VERSION }}
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name README.md)" ]; then
            echo "No changesets - nothing to release" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          previous=$(node -p "require('./package.json').version")
          pnpm changeset version
          version=$(node -p "require('./package.json').version")
          if [ "$version" = "$previous" ]; then
            echo "Only empty changesets - nothing to release" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -A
          git commit -m "chore(release): $version [skip ci]"
          git tag "v$version"
          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_NEW=true"
            echo "RELEASE_NPM=true"
            echo "RELEASE_GH=true"
          } >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release notes
        if: ${{ env.RELEASE_VERSION }}
        run: |
          awk -v h="## $RELEASE_VERSION" '$0 == h { f = 1; next } f && /^#{1,2} / { exit } f' CHANGELOG.md > release-notes.md
          {
            if [ "$DRY_RUN" = "true" ]; then echo "## v$RELEASE_VERSION (dry run - nothing was published)"; else echo "## v$RELEASE_VERSION"; fi
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: build
        if: ${{ env.RELEASE_VERSION }}
        run: pnpm build
      - name: Check package contents
        if: ${{ env.RELEASE_NPM == 'true' && env.DRY_RUN == 'true' }}
        run: npm publish --dry-run --access public
      - name: Push release commit and tag
        if: ${{ env.RELEASE_NEW == 'true' && env.DRY_RUN != 'true' }}
        run: git push origin HEAD:main "v$RELEASE_VERSION"
      - name: Publish to npm
        if: ${{ env.RELEASE_NPM == 'true' && env.DRY_RUN != 'true' }}
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Create GitHub release
        if: ${{ env.RELEASE_GH == 'true' && env.DRY_RUN != 'true' }}
        run: gh release create "v$RELEASE_VERSION" --title "v$RELEASE_VERSION" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
