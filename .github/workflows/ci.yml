name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # called by the Release workflow (.github/workflows/release.yml) before publishing
  workflow_call:

jobs:
  cache:
    name: CI cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm i

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm i
      - name: Lint
        run: pnpm lint.ci

  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [cache, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install rimraf
        run: npm i -g rimraf
      - name: Install dependencies
        run: pnpm i
      - name: build
        run: pnpm build
      - name: Install Cypress
        run: pnpm cypress install
      - name: Run cypress tests
        uses: cypress-io/github-action@a85ef18dd1056ef76e55bc8862d7aa6f1c0d9590
        with:
          install: true
          command: pnpm test.ci
      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-report
          path: |
            cypress/report
            cypress/screenshots
            cypress/snapshots
            cypress/logs

  changeset:
    if: ${{ github.event_name == 'pull_request' && !contains(fromJSON('["renovate[bot]", "dependabot[bot]"]'), github.event.pull_request.user.login) }}
    name: changeset present
    runs-on: ubuntu-latest
    needs: cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm i
      - name: Check changeset
        run: pnpm changeset status --since=origin/main

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [cache, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install rimraf
        run: npm i -g rimraf
      - name: Install dependencies
        run: pnpm i
      - name: Build
        run: pnpm build
      - name: Build docs
        run: pnpm docs:build
      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
