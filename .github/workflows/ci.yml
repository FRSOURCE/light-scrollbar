name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  cache:
    name: CI cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 10.20.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm i

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm i
      - name: Lint
        run: pnpm lint.ci

  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [cache, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Install rimraf
        run: npm i -g rimraf
      - name: Install dependencies
        run: pnpm i
      - name: build
        run: pnpm build
      - name: Install Cypress
        run: pnpm cypress install
      - name: Run cypress tests
        uses: cypress-io/github-action@a85ef18dd1056ef76e55bc8862d7aa6f1c0d9590
        with:
          install: true
          command: pnpm test.ci
      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: cypress-report
          path: |
            cypress/report
            cypress/screenshots
            cypress/snapshots
            cypress/logs

  build-and-release:
    if: ${{ github.actor != 'dependabot[bot]' }}
    name: build and release
    runs-on: ubuntu-latest
    needs: [cache, lint, test]
    permissions:
      contents: write # push release commit/tag, create GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # pulls all commits (needed for lerna / semantic release to correctly version)
          fetch-depth: "0"
          persist-credentials: false
      - name: Setup git user
        run: |
          git config --global user.name "$(git --no-pager log --format=format:'%an' -n 1)"
          git config --global user.email "$(git --no-pager log --format=format:'%ae' -n 1)"
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Install rimraf
        run: npm i -g rimraf
      - name: Install dependencies
        run: pnpm i
      - name: build
        run: pnpm build
      - name: release package
        if: ${{ success() && github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: pnpm release.ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [cache, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Install rimraf
        run: npm i -g rimraf
      - name: Install dependencies
        run: pnpm i
      - name: Build
        run: pnpm build
      - name: Build docs
        run: pnpm docs:build
      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
