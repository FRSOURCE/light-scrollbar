name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # automatic release (if there are pending changesets) twice a month
    - cron: "0 6 1,15 * *"
  # manual release: Actions -> CI -> Run workflow
  workflow_dispatch:

jobs:
  cache:
    name: CI cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm i

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm i
      - name: Lint
        run: pnpm lint.ci

  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [cache, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install rimraf
        run: npm i -g rimraf
      - name: Install dependencies
        run: pnpm i
      - name: build
        run: pnpm build
      - name: Install Cypress
        run: pnpm cypress install
      - name: Run cypress tests
        uses: cypress-io/github-action@a85ef18dd1056ef76e55bc8862d7aa6f1c0d9590
        with:
          install: true
          command: pnpm test.ci
      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-report
          path: |
            cypress/report
            cypress/screenshots
            cypress/snapshots
            cypress/logs

  changeset:
    if: ${{ github.event_name == 'pull_request' && !contains(fromJSON('["renovate[bot]", "dependabot[bot]"]'), github.event.pull_request.user.login) }}
    name: changeset present
    runs-on: ubuntu-latest
    needs: cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm i
      - name: Check changeset
        run: pnpm changeset status --since=origin/main

  release:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    name: release
    runs-on: ubuntu-latest
    needs: [cache, lint, test]
    concurrency: release
    permissions:
      contents: write # push release commit/tag, create GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # tags are needed to find the previous release
          fetch-depth: "0"
      - name: Setup git user
        # official GitHub Actions bot account (41898282 is its user id),
        # so release commits are attributed to github-actions[bot]
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install rimraf
        run: npm i -g rimraf
      - name: Install dependencies
        run: pnpm i
      - name: Add changeset for dependencies updates
        run: pnpm changeset.deps
      - name: Version package
        id: version
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name README.md)" ]; then
            echo "No changesets - nothing to release"
            exit 0
          fi
          previous=$(node -p "require('./package.json').version")
          pnpm changeset version
          version=$(node -p "require('./package.json').version")
          if [ "$version" = "$previous" ]; then
            echo "Only empty changesets - nothing to release"
            exit 0
          fi
          git add -A
          git commit -m "chore(release): $version [skip ci]"
          git tag "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        if: ${{ steps.version.outputs.version }}
        run: pnpm build
      - name: Push release commit and tag
        if: ${{ steps.version.outputs.version }}
        run: git push origin HEAD:main "v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Publish to npm
        if: ${{ steps.version.outputs.version }}
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Create GitHub release
        if: ${{ steps.version.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0 == h { f = 1; next } f && /^#{1,2} / { exit } f' CHANGELOG.md > release-notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [cache, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install rimraf
        run: npm i -g rimraf
      - name: Install dependencies
        run: pnpm i
      - name: Build
        run: pnpm build
      - name: Build docs
        run: pnpm docs:build
      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
