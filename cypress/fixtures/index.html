<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="../../dist/index.css" />
    <link rel="stylesheet" href="../../dist/rail.css" />
    <style>
        .my-scrollbar {
            height: 200px;
            overflow: auto;
            padding: 20px;
        }

        .item {
            width: 120vw;
            border: 1px solid orange;
        }

        .item:hover {
            height: 50px;
        }

        /* toggled by the overflow tests - declared after .my-scrollbar, so they win over its overflow: auto */
        .overflow-hidden {
            overflow: hidden;
        }

        .overflow-x-hidden {
            overflow-x: hidden;
        }

        .overflow-scroll {
            overflow: scroll;
        }

        .ancestor-overflow-hidden .my-scrollbar {
            overflow: hidden;
        }
    </style>
</head>

<body class="body-example">
    <div class="my-wrapper-standalone" style="border: 1px solid teal;"></div>
    <div class="my-wrapper" style="border: 1px solid green;" tabIndex="10">

</body>

</html>
